<style data-atgit-offer="css">
section.hero {
  background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9yD3NAidzp4_4S_r7OUuib5TvyAFYntImLqnGPpXuYkqqYkQwvY4T7Sa2&s=10");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
</style>

<script data-atgit-offer="js">
(function () {
  document.querySelectorAll("[data-atgit-offer-host]").forEach(function (node) {
    node.remove();
  });

  var hero =
    document.querySelector("html > body > section.hero:nth-of-type(1)") ||
    document.querySelector("section.hero");
  if (!hero) return;

  var imageUrl =
    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9yD3NAidzp4_4S_r7OUuib5TvyAFYntImLqnGPpXuYkqqYkQwvY4T7Sa2&s=10";

  hero.style.backgroundImage = 'url("' + imageUrl + '")';
  hero.style.backgroundSize = "cover";
  hero.style.backgroundPosition = "center";
  hero.style.backgroundRepeat = "no-repeat";
  hero.setAttribute("data-atgit-bg-image", imageUrl);
})();
</script>
