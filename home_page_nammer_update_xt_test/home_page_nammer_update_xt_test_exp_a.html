<style data-atgit-offer="css">
section.hero {
  background-image: url("https://static.vecteezy.com/system/resources/previews/025/737/013/non_2x/lufthansa-airbus-a380-d-aimf-passenger-plane-landing-at-frankfurt-airport-free-photo.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
</style>

<script data-atgit-offer="js">
(function () {
  document.querySelectorAll("[data-atgit-offer-host]").forEach(function (node) {
    node.remove();
  });

  var hero =
    document.querySelector("section.hero") ||
    document.querySelector("html > body > section.hero");
  if (!hero) return;

  var url =
    "https://static.vecteezy.com/system/resources/previews/025/737/013/non_2x/lufthansa-airbus-a380-d-aimf-passenger-plane-landing-at-frankfurt-airport-free-photo.jpg";

  hero.style.backgroundImage = 'url("' + url + '")';
  hero.style.backgroundSize = "cover";
  hero.style.backgroundPosition = "center";
  hero.style.backgroundRepeat = "no-repeat";
  hero.setAttribute("data-atgit-bg-image", url);
})();
</script>
