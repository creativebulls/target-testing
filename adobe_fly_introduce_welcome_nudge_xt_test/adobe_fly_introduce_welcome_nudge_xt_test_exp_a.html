<style data-atgit-offer="css">
[data-atgit-offer-host] {
  box-sizing: border-box;
}

[data-atgit-offer-host].atgit-welcome-nudge {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
  width: min(340px, calc(100vw - 32px));
  padding: 22px 22px 20px;
  background: rgb(255, 255, 255);
  color: rgb(26, 36, 51);
  border: 1px solid rgb(11, 31, 58);
  border-radius: 16px;
  box-shadow: 0 12px 32px rgba(11, 31, 58, 0.18);
  font-family: "DM Sans", sans-serif;
  transform: translateX(120%);
  opacity: 0;
  transition: transform 0.45s ease, opacity 0.45s ease;
}

[data-atgit-offer-host].atgit-welcome-nudge.atgit-welcome-nudge--in {
  transform: translateX(0);
  opacity: 1;
}

[data-atgit-offer-host] .atgit-welcome-close {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: rgb(244, 247, 251);
  color: rgb(11, 31, 58);
  font-family: "DM Sans", sans-serif;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}

[data-atgit-offer-host] .atgit-welcome-eyebrow {
  margin: 0 0 8px;
  font-family: "DM Sans", sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgb(11, 31, 58);
}

[data-atgit-offer-host] .atgit-welcome-title {
  margin: 0 0 10px;
  padding-right: 24px;
  font-family: "Playfair Display", serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.25;
  color: rgb(11, 31, 58);
}

[data-atgit-offer-host] .atgit-welcome-copy {
  margin: 0 0 18px;
  font-family: "DM Sans", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: rgb(26, 36, 51);
}

[data-atgit-offer-host] .atgit-welcome-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  background: rgb(11, 31, 58);
  color: rgb(255, 255, 255);
  font-family: "DM Sans", sans-serif;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

[data-atgit-offer-host] .atgit-welcome-cta:hover {
  background: rgb(26, 36, 51);
}

@media (max-width: 480px) {
  [data-atgit-offer-host].atgit-welcome-nudge {
    right: 16px;
    bottom: 16px;
    padding: 18px 18px 16px;
  }

  [data-atgit-offer-host] .atgit-welcome-title {
    font-size: 20px;
  }
}
</style>

<script data-atgit-offer="js">
(function () {
  document.querySelectorAll("[data-atgit-offer-host]").forEach(function (node) {
    node.remove();
  });

  var host = document.createElement("aside");
  host.setAttribute("data-atgit-offer-host", "1");
  host.className = "atgit-welcome-nudge";
  host.setAttribute("role", "dialog");
  host.setAttribute("aria-label", "Welcome to SkyJet Airlines");

  var closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "atgit-welcome-close";
  closeBtn.setAttribute("aria-label", "Close welcome message");
  closeBtn.textContent = "×";

  var eyebrow = document.createElement("p");
  eyebrow.className = "atgit-welcome-eyebrow";
  eyebrow.textContent = "Welcome aboard";

  var title = document.createElement("h2");
  title.className = "atgit-welcome-title";
  title.textContent = "Ready for your next flight?";

  var copy = document.createElement("p");
  copy.className = "atgit-welcome-copy";
  copy.textContent =
    "Dummy test copy — explore routes, compare fares, and book your SkyJet trip in a few clicks.";

  var cta = document.createElement("a");
  cta.className = "atgit-welcome-cta";
  cta.href = "#searchForm";
  cta.textContent = "Book now";

  closeBtn.addEventListener("click", function () {
    host.classList.remove("atgit-welcome-nudge--in");
    window.setTimeout(function () {
      if (host.parentNode) host.remove();
    }, 450);
  });

  cta.addEventListener("click", function (event) {
    var form = document.querySelector("#searchForm");
    if (form) {
      event.preventDefault();
      form.scrollIntoView({ behavior: "smooth", block: "center" });
      host.classList.remove("atgit-welcome-nudge--in");
      window.setTimeout(function () {
        if (host.parentNode) host.remove();
      }, 450);
    }
  });

  host.appendChild(closeBtn);
  host.appendChild(eyebrow);
  host.appendChild(title);
  host.appendChild(copy);
  host.appendChild(cta);
  document.body.appendChild(host);

  window.requestAnimationFrame(function () {
    window.requestAnimationFrame(function () {
      host.classList.add("atgit-welcome-nudge--in");
    });
  });
})();
</script>
